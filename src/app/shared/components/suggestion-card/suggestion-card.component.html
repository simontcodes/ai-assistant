<article class="suggestion-card" [class.suggestion-card--done]="suggestion.state === 'done'">
  <div class="suggestion-card__rank">{{ rank }}</div>
  <div class="suggestion-card__content">
    <div class="suggestion-card__header">
      <h3>{{ suggestion.title }}</h3>
      <span class="suggestion-card__score">Score {{ suggestion.score }}</span>
    </div>
    <div class="suggestion-card__meta">
      <span>
        <ion-icon name="time-outline"></ion-icon>
        {{ suggestion.totalRequiredMinutes }} min
      </span>
      <span *ngIf="suggestion.travelTimeMinutes">
        <ion-icon name="navigate-outline"></ion-icon>
        {{ suggestion.travelTimeMinutes * 2 }} min travel
      </span>
    </div>
    <p class="suggestion-card__reason">{{ suggestion.reason }}</p>
    <div class="suggestion-card__footer">
      <span class="suggestion-card__state" *ngIf="suggestion.state && suggestion.state !== 'active'">
        {{ suggestion.state | titlecase }}
      </span>
      <div class="suggestion-card__actions">
        <button type="button" class="action action--primary" (click)="onAction('do-now')" [disabled]="suggestion.state === 'done'">
          {{ suggestion.state === 'accepted' ? 'In Focus' : 'Do This' }}
        </button>
        <button type="button" class="action" (click)="onAction('later')" [disabled]="suggestion.state === 'done'">
          {{ suggestion.state === 'deferred' ? 'Deferred' : 'Later' }}
        </button>
        <button type="button" class="action action--success" (click)="onAction('done')">Done</button>
      </div>
    </div>
  </div>
</article>
