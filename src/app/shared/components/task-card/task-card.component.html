<article class="task-card soft-card" [class]="'task-card ' + visualClass" [class.is-done]="task.status === 'done'">
  <div class="task-visual"></div>
  <div class="task-body">
    <div class="task-head">
      <h3>{{ task.title }}</h3>
      <span class="badge">{{ badgeLabel }}</span>
    </div>
    <p class="task-meta">
      <ion-icon name="time-outline"></ion-icon>
      {{ task.estimatedDurationMinutes }}m
      <span>•</span>
      {{ task.canDoRemotely ? 'Remote' : 'On-site' }}
    </p>
    <p class="task-meta">
      <ion-icon name="sunny-outline"></ion-icon>
      Best time:
      {{ task.bestTimeOfDay?.[0] ? (task.bestTimeOfDay?.[0] | titlecase) : 'Flexible' }}
    </p>
    <p *ngIf="task.dueDate" class="task-meta">
      <ion-icon name="flag-outline"></ion-icon>
      Due {{ task.dueDate | date: 'MMM d, h:mm a' }}
    </p>
    <div class="task-actions">
      <button type="button" class="edit-btn" (click)="editTask.emit(task.id)">
        <ion-icon name="create-outline"></ion-icon>
        Edit
      </button>
      <button *ngIf="task.status === 'pending'" type="button" class="done-btn" (click)="markDone.emit(task.id)">
        Mark Done
      </button>
    </div>
  </div>
</article>
